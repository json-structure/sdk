<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>JSON Structure Editor</title>
    <style>html,body,#editor{height:100%;margin:0}body{background:#121719}</style>
  </head>
  <body>
    <div id="editor"></div>
    <script type="module">
      import { bootstrapJsonStructureEditor } from './bootstrap.ts';
      bootstrapJsonStructureEditor(document.querySelector('#editor'), JSON.stringify({
          $schema: 'https://json-structure.org/meta/core/v0/#',
          definitions: {
            Address: { type: 'object', properties: { street: { type: 'string' }, postalCode: { type: 'string' } } },
            Person: { type: 'object', $extends: '#/definitions/Address', properties: { id: { type: 'uuid' }, name: { type: 'string' }, address: { $ref: '#/definitions/Address' } }, required: ['id', 'name'] }
          }
        }, null, 2));
    </script>
  </body>
</html>
