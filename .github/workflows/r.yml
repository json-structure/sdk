name: R SDK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'r/**'
      - 'c/**'
      - '.github/workflows/r.yml'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'r/**'
      - 'c/**'
      - '.github/workflows/r.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Check R ${{ matrix.r }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        r: ['release', 'oldrel-1', 'devel']

    env:
      R_KEEP_PKG_SOURCE: yes
      # The engine is compiled from bundled source, so the check builds and
      # links the native code on every OS. Point the shared conformance corpus
      # at the repo checkout so the test-assets tests (including `pattern`
      # cases) run inside R CMD check on all platforms instead of skipping.
      JSONSTRUCTURE_TEST_ASSETS: ${{ github.workspace }}/test-assets

    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          extra-packages: |
            any::rcmdcheck
            any::testthat

      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: r
          args: 'c("--no-manual", "--as-cran")'
          error-on: '"warning"'
          upload-snapshots: true

  regex-sanitizers:
    name: Regex ASAN/UBSAN (clang)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      # The engine and cJSON are covered by the C SDK's Valgrind job; the only
      # hand-written, memory-sensitive C added for the R package is the pure-C
      # regex matcher, so we stress it directly under AddressSanitizer and
      # UndefinedBehaviorSanitizer with a dedicated harness (no R needed, so the
      # check is fast and deterministic).
      - name: Compile matcher + harness under ASAN/UBSAN
        run: >-
          clang -std=gnu11 -g -O1 -Wall -Wextra
          -fsanitize=address,undefined -fno-sanitize-recover=all
          -fno-omit-frame-pointer
          -I r/src
          r/src/regex_utils.c r/tools/sanitizer/regex_asan.c
          -o regex_asan

      - name: Run regex sanitizer harness
        env:
          ASAN_OPTIONS: abort_on_error=1:detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1:halt_on_error=1
        run: ./regex_asan

  lint:
    name: Lint R code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          extra-packages: any::lintr

      # Lint is advisory: it surfaces style/robustness suggestions in the log
      # (scoped by r/.lintr) but does not gate merges while the SDK stabilises.
      # Set continue-on-error to false to enforce once the backlog is clear.
      - name: Run lintr (advisory)
        working-directory: r
        run: Rscript -e "lintr::lint_package()"
        continue-on-error: true

  release:
    name: Attach R source tarball to release
    runs-on: ubuntu-latest
    needs: [test, regex-sanitizers, lint]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r

      - name: Sync DESCRIPTION version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i -E "s/^Version:[[:space:]]*.*/Version: ${VERSION}/" r/DESCRIPTION
          echo "Set DESCRIPTION version to ${VERSION}"
          grep -E '^Version:' r/DESCRIPTION

      - name: Build source tarball
        shell: bash
        run: R CMD build r

      - name: Upload tarball to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" jsonstructure_*.tar.gz --clobber
