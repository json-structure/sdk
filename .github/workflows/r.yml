name: R SDK

on:
  push:
    branches: [ main, master ]
    paths:
      - 'r/**'
      - 'c/**'
      - '.github/workflows/r.yml'
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'r/**'
      - 'c/**'
      - '.github/workflows/r.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Check R ${{ matrix.r }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        r: ['release', 'oldrel-1']

    env:
      R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v6

      - name: Build C library (CI only - production uses pre-built release binaries)
        shell: bash
        run: |
          cmake -S c -B c/build -DCMAKE_BUILD_TYPE=Release -DJS_BUILD_SHARED=ON -DJS_BUILD_TESTS=OFF -DJS_BUILD_EXAMPLES=OFF
          cmake --build c/build --config Release
          if [ "$RUNNER_OS" = "macOS" ]; then
            echo "JSONSTRUCTURE_LIB_PATH=$GITHUB_WORKSPACE/c/build/libjson_structure.dylib" >> "$GITHUB_ENV"
          else
            echo "JSONSTRUCTURE_LIB_PATH=$GITHUB_WORKSPACE/c/build/libjson_structure.so" >> "$GITHUB_ENV"
          fi

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.r }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          extra-packages: |
            any::rcmdcheck
            any::testthat

      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: r
          error-on: '"error"'
          upload-snapshots: true

      - name: Conformance tests against shared test-assets
        working-directory: r
        shell: bash
        env:
          JSONSTRUCTURE_TEST_ASSETS: ${{ github.workspace }}/test-assets
        run: |
          R CMD INSTALL .
          Rscript -e "library(testthat); library(jsonstructure); testthat::test_dir('tests/testthat', stop_on_failure = TRUE)"

  windows:
    name: Check R release on windows-latest (shim compile + pure-R tests)
    runs-on: windows-latest
    env:
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          extra-packages: |
            any::rcmdcheck
            any::testthat

      # No prebuilt library is provided here, so binding-dependent tests skip
      # gracefully. This job verifies the compiled shim builds under Rtools and
      # that the pure-R logic (augmentation, result objects) passes on Windows.
      - uses: r-lib/actions/check-r-package@v2
        with:
          working-directory: r
          error-on: '"error"'

  lint:
    name: Lint R code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r
          extra-packages: any::lintr

      # Lint is advisory: it surfaces style/robustness suggestions in the log
      # (scoped by r/.lintr) but does not gate merges while the SDK stabilises.
      # Set continue-on-error to false to enforce once the backlog is clear.
      - name: Run lintr (advisory)
        working-directory: r
        run: Rscript -e "lintr::lint_package()"
        continue-on-error: true

  release:
    name: Attach R source tarball to release
    runs-on: ubuntu-latest
    needs: [test, windows, lint]
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: r

      - name: Sync DESCRIPTION version from tag
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sed -i -E "s/^Version:[[:space:]]*.*/Version: ${VERSION}/" r/DESCRIPTION
          echo "Set DESCRIPTION version to ${VERSION}"
          grep -E '^Version:' r/DESCRIPTION

      - name: Build source tarball
        shell: bash
        run: R CMD build r

      - name: Upload tarball to GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" jsonstructure_*.tar.gz --clobber
